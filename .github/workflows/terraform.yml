name: Terraform IaC CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'backend/services/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'backend/services/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action to execute'
        required: true
        default: 'plan'
        type: choice
        options:
          - 'plan'
          - 'apply'
          - 'validate_only'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Validate, Plan & Apply
    runs-on: ubuntu-latest
    environment: replica

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'
          terraform_wrapper: false

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: 🔍 Check Terraform Format
        run: terraform fmt -check -diff || true

      - name: 🚀 Terraform Init
        run: terraform init -input=false

      - name: 📋 Terraform Validate
        run: terraform validate -no-color

      - name: 📊 Terraform Plan
        if: github.event.inputs.action != 'validate_only'
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan

      - name: 🚀 Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          echo "Applying Terraform changes..."
          terraform apply -auto-approve -input=false tfplan

      - name: ⏱️ Apply CloudWatch Log Retention Policy (7 days)
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          python3 -c "
          import boto3
          client = boto3.client('logs', region_name='${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}')
          paginator = client.get_paginator('describe_log_groups')
          for page in paginator.paginate(logGroupNamePrefix='/aws/lambda/'):
              for lg in page.get('logGroups', []):
                  name = lg['logGroupName']
                  try:
                      client.put_retention_policy(logGroupName=name, retentionInDays=7)
                      print(f'Set 7-day retention for: {name}')
                  except Exception as e:
                      print(f'Warning on {name}: {e}')
          "

      - name: 💰 Setup AWS Cost Anomaly Detection Email Subscription
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: |
          python3 -c "
          import boto3
          try:
              ce = boto3.client('ce', region_name='us-east-1')
              monitors = ce.get_anomaly_monitors().get('AnomalyMonitors', [])
              if not monitors:
                  print('No anomaly monitors found in account.')
              else:
                  arn = monitors[0]['MonitorArn']
                  print(f'Found existing anomaly monitor: {arn}')
                  subs = ce.get_anomaly_subscriptions().get('AnomalySubscriptions', [])
                  email = 'lointt1199@gmail.com'
                  has_sub = any(any(s.get('Address') == email for s in sub.get('Subscribers', [])) for sub in subs)
                  if not has_sub:
                      ce.create_anomaly_subscription(
                          AnomalySubscription={
                              'SubscriptionName': 'CostAnomalyAlert-Replica',
                              'MonitorArnList': [arn],
                              'Subscribers': [{'Type': 'EMAIL', 'Address': email}],
                              'Frequency': 'IMMEDIATE',
                              'ThresholdExpression': {
                                  'Dimension': {
                                      'Key': 'ANOMALY_TOTAL_IMPACT_ABSOLUTE',
                                      'Values': ['2'],
                                      'MatchOptions': ['GREATER_THAN_OR_EQUAL']
                                  }
                              }
                          }
                      )
                      print(f'Successfully subscribed {email} to Cost Anomaly Detection!')
                  else:
                      print(f'{email} is already subscribed to Cost Anomaly Detection.')
          except Exception as e:
              print(f'Cost Anomaly Detection setup note: {e}')
          "

      - name: 🔄 Sync Vector KB & Store Policies to S3
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install boto3 google-genai
          python backend/services/sync_to_kb/handler.py
