name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Package & Deploy Python Microservices & Workers
    runs-on: ubuntu-latest
    environment: replica

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: 📦 Package & Deploy CatalogServiceHandler
        run: |
          cd backend/services/catalog
          python3 -c "import zipfile; zf = zipfile.ZipFile('catalog.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name CatalogServiceHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://catalog.zip
          cd ../../..

      - name: 📦 Package & Deploy CartServiceHandler
        run: |
          cd backend/services/cart
          python3 -c "import zipfile; zf = zipfile.ZipFile('cart.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name CartServiceHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://cart.zip
          cd ../../..

      - name: 📦 Package & Deploy OrderServiceHandler
        run: |
          cd backend/services/order
          python3 -c "import zipfile; zf = zipfile.ZipFile('order.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name OrderServiceHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://order.zip
          aws lambda update-function-configuration \
            --function-name OrderServiceHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --environment "Variables={ORDERS_TABLE=Orders_${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }},CARTS_TABLE=Carts_${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }},PRODUCTS_TABLE=Products_${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }},EVENT_BUS_NAME=ecommerce-event-bus-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'replica' }},VNPAY_RETURN_URL=${{ vars.NEXT_PUBLIC_CDN_BASE_URL || secrets.NEXT_PUBLIC_CDN_BASE_URL }}/order-success,VNPAY_TMN_CODE=${{ vars.VNPAY_TMN_CODE || secrets.VNPAY_TMN_CODE }},VNPAY_HASH_SECRET=${{ secrets.VNPAY_HASH_SECRET }},VNPAY_URL=${{ vars.VNPAY_URL || 'https://sandbox.vnpayment.vn/paymentv2/vpcpay.html' }}}"
          cd ../../..

      - name: 📦 Package & Deploy PaymentWebhookHandler
        run: |
          cd backend/services/payment_webhook
          python3 -c "import zipfile; zf = zipfile.ZipFile('payment.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name PaymentWebhookHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://payment.zip
          aws lambda update-function-configuration \
            --function-name PaymentWebhookHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --environment "Variables={ORDERS_TABLE=Orders_${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }},EVENT_BUS_NAME=ecommerce-event-bus-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'replica' }},VNPAY_HASH_SECRET=${{ secrets.VNPAY_HASH_SECRET }}}"
          cd ../../..

      - name: 📦 Package & Deploy UserProfileHandler
        run: |
          cd backend/services/user
          python3 -c "import zipfile; zf = zipfile.ZipFile('user.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name UserProfileHandler-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://user.zip
          cd ../../..

      - name: 📦 Package & Deploy InventoryWorker
        run: |
          cd backend/workers/inventory
          python3 -c "import zipfile; zf = zipfile.ZipFile('inventory.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name InventoryWorker-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://inventory.zip
          cd ../../..

      - name: 📦 Package & Deploy ShippingWorker
        run: |
          cd backend/workers/shipping
          python3 -c "import zipfile; zf = zipfile.ZipFile('shipping.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name ShippingWorker-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://shipping.zip
          aws lambda update-function-configuration \
            --function-name ShippingWorker-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --environment "Variables={ORDERS_TABLE=Orders_${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }},EVENT_BUS_NAME=ecommerce-event-bus-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'replica' }},GHN_API_URL=${{ vars.GHN_API_URL || 'https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/create' }},GHN_API_TOKEN=${{ secrets.GHN_API_TOKEN }},GHN_SHOP_ID=${{ vars.GHN_SHOP_ID || secrets.GHN_SHOP_ID }},SHIPPING_PARTNER=Giao Hàng Nhanh (GHN)}"
          cd ../../..

      - name: 📦 Package & Deploy NotificationWorker (Gmail SMTP)
        run: |
          cd backend/workers/notification
          python3 -c "import zipfile; zf = zipfile.ZipFile('notification.zip', 'w'); zf.write('handler.py', 'lambda_function.py'); zf.close()"
          aws lambda update-function-code \
            --function-name NotificationWorker-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --zip-file fileb://notification.zip
          aws lambda update-function-configuration \
            --function-name NotificationWorker-${{ vars.AWS_ENVIRONMENT_TITLE || secrets.AWS_ENVIRONMENT_TITLE || 'Replica' }} \
            --environment "Variables={SMTP_SERVER=${{ vars.SMTP_SERVER || 'smtp.gmail.com' }},SMTP_PORT=${{ vars.SMTP_PORT || '465' }},SMTP_USER=${{ vars.SMTP_USER || secrets.SMTP_USER }},SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}}"
          cd ../../..

      - name: 🔄 Invalidate CloudFront API Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/api/*"
